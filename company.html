<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="company.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <title>Company-Project</title>
</head>
<body>

    <div class="logo">
        <img src="logo.png" alt="">
        <div class="logotext">
        <h1>TalLink</h1>
        <p style="font-size: 10px; color: steelblue;">Connecting Talent & Oppotunity</p>
        </div>

    </div>

    <div class="hero">
    <div class="hero-image">
        <h1>This information pertains <span style="color: #0fa8b8;"> to your Company</span></h1>
    <img src="workwoman.png" alt="">
    </div>


    <div class="hero-input">
        <div class="hero-header">
      <p style="color: #0fa8b8; font-weight: bold; font-size: 14px;">Company Information</p>
      <h1>Tell us about your <span style="color: #0fa8b8; ">company</span></h1>
      <p>Help us understand your organization so we can match you to the right talent.</p>
      
    </div>

      <form action="password.html" method="post">

        <div class="group">
          <label for="company-name"><i class="fa-solid fa-city"></i></i> Company name*</label>
          <input type="text" id="company-name" name="company-name" placeholder="Enter your company name" required>
        </div>

        <div class="group">
          <label for="company-website"><i class="fa-solid fa-globe"></i> Company website <small style="font-weight: 100;">(optional)</small></label>
          <input type="url" id="company-website" name="company-website" placeholder="https://www.yourcompany.com">
        </div>



        
        <div class="group">
    <label for="industry"><i class="fa-solid fa-sliders"></i> Industry*</label>
    <select id="course" name="course" required>
        <option value="">Select...</option>
        <option value="agriculture">Agriculture</option>
        <option value="contruction">Contruction</option>
        <option value="acounting">Banking, Finance & Insurance</option>
        <option value="education">Education</option>
        <option value="governmennt">Government</option>
        <option value="Healthcare">Healthcare</option>
        <option value="housing">Housing</option>
        <option value="recruitment">Recruitment</option>
        <option value="law">Law & Compliance</option>
        <option value="telecom">IT & Telecoms</option>
        <option value="ship">Shipping & Logistics</option>
        <option value="manufacture">Manufacturing & Warehousing</option>
        <option value="masscom">Advertising, Media & Communication</option>
        <option value="charity">NGO, NPO & Charity</option>
        <option value="tourism">Tourism</option>
        <option value="aviation">Automotive & Aviation</option>
        <option value="sport">Sport</option>



    </select>
    </div>



        <div class="group">
    <label for="employee-no"> <i class="fa-solid fa-users-line"></i> Number of Employee*</label>
    <select id="course" name="course" required>
        <option value="">Select...</option>
        <option value="1-4">1-4</option>
        <option value="5-10">5-10</option>
        <option value="11-25">11-25</option>
        <option value="26-50">26-50</option>
        <option value="51-100">51-100</option>
        <option value="101-200">101-200</option>
        <option value="201-500">201-500</option>
        <option value="500+">500+</option>



    </select>
    </div>

    
    <div class="group">
    <label for="address"><i class="fa-solid fa-map-marker-alt"></i> Address*</label>
    <textarea id="address" name="address" rows="4" placeholder="enter your address"></textarea>
    </div>
   

     <div class="checkbox-group">
        <label>
            <input type="checkbox" required>
            I agree to the <span style="color: blue; text-decoration: underline;"> Terms of Service</span> and 
            <span style="color: blue; text-decoration: underline;"> Privacy Policy</span>
        </label>
         </div>






<button type="submit" class="submit-btn"> Next <i class="fa-solid fa-arrow-right-long"></i>

    </button>




        </form>
        </div>












</body>
</html>
