<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        *{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
html{
    scroll-behavior: smooth;
}
body{
    color: #142b4a;
    background-color: #f8fbfd;
    padding: 50px 10%;
    font-family: "Poppins", sans-serif;  
    
} 
.hero{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    
}
.hero-header{
    display: flex;
    flex-direction: column;
   justify-content: center;
    width: 100%;
    
}
.hero-header p{
    width: 70%;
}
.hero-header h1{
    font-size: 50px;
    line-height: 1.0;
    margin: 10px 0 15px;
    width: 100%;
}
.hero-header img{
    width: 90%;
    height: auto;
}
.hero-input{
    background-color: white;
    padding: 30px 10%;
    border-radius: 20px;
    box-shadow: 0 10px 45px rgba(0, 0, 0, 0.15);
    margin: auto;

}

.form-group > label{
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}
.group{
    display: flex;
    align-items: center;
    position: relative;
    margin-bottom: 15px;
}
.group input{
    padding: 10px 20px 10px 45px;
    border-radius: 8px;
    width: 100%;
    outline: none;
    background-color: #f8fbfd;
    border: 1px solid #d5e4f2;
}
.group i{
    position: absolute;
    padding-left: 10px;
}
.checkbox-group{
    margin-bottom: 25px;
}
.checkbox-group label{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    cursor: pointer;
        
}
.checkbox-group input{
    accent-color: #0fa8b8;
    width: 16px;
    height: 16px;
}
.submit-btn{
        width: 100%;
        padding: 15px;
        background-color: #0fa8b8;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease, tansform 0.3s ease;
    }
    .submit-btn:hover{
        background-color: #6483b4;
        transform: translateY(-2px);
    }
    .submit-btn:active{
        transform: translateY(0);
    }
.group input::placeholder{
    color: #6483b4;
}
.group input:focus{
    border-color: #0fa8b8;
    box-shadow: 0 0 0 3px rgba(34, 144, 174, 0.15);
}
.form-header{
    margin-bottom: 20px;
}
.form-header h1{
    font-size: 30px;
}
.form-header p{
    color: #6483b4;
}
.acc{
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    
}
.acc a:hover{
    text-decoration: underline;
    color: blue;
}
.acc a{
    color: #0fa8b8;
    text-decoration: none;
    transition: all 0.3s linear;

}
@media (max-width: 768px) {
    .hero{
        grid-template-columns: repeat(1, 1fr);
    }
    .hero .hero-header img{
        object-fit: cover;
        height: 200px;
        margin-top: 10px;
    }
    .hero-header p{
        width: 90%;
    }
    .hero-header h1{
        font-size: 35px;
    }
}
.logo{
    display: flex;
    justify-content: flex-start;
    align-items: center;
    background-color: whitesmoke;
    width: 30%;
    padding-top: 10;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
    margin-bottom: 30px;

}

.logotext{
    line-height: 1.0;
    font-weight: bold;
}
.logo img{
    padding-left: 10px;
    height: 50px;
    margin-right: -40px;
}
.logos a{
   color: #007BFF;
   text-decoration: none;
}
.logos a:hover{
            color: #005FCC;
            transform: translateY(-2px);
        }
        .logos a:active{
            transform: scale(0.96);
        }
        .logos a:focus-visible{
            outline: 2px solid #007BFF;
        }

@media (max-width:768px) {
    .logo{
        width: 100%;
        margin-bottom: 20px;
        line-height: 0.5;
        margin-right: 30px;
    }
    .logo p{
        line-height: 1.0;
    }
    .logo .logotext{
        line-height: 1.0;
    }
    .logo img{
        height: 40px;
        margin-right: -30px;
    }
   
}
    </style>

    <title>Password-TalLink</title>
</head>
<body>

    <div class="logo">
        <img src="logo.png" alt="">
        <div class="logotext">
        <h1>TalLink</h1>
        <p style="font-size: 10px; color: steelblue;">Connecting Talent & Oppotunity</p>
        </div>

    </div>

    <div class="hero">
    <div class="hero-header">
      <p style="color: #0fa8b8; font-weight: bold; font-size: 14px;">CREATE A STRONG PASSWORD</p>

      <p>Choose a strong password to protect your account and personal information.</p>
      <img src="pass.png" alt="">
    </div>
    <div class="hero-input">

      <form action="login.html" method="post">
        <div class="form-header">

        <div class="form-group">
          <label for="password">Create Password</label>
          <div class="group">         
          <input type="password" id="password" placeholder="Create Password" required>
         <i class="fa-solid fa-lock"></i>

        <div class="form-group">
          <label for="password">Confirm Password</label>
          <div class="group">         
          <input type="password" id="confirm-password" placeholder="Confirm Password" required>
          <i class="fa-solid fa-lock"></i>
        </div>



        
              <div class="checkbox-group">
        <label>
            <input type="checkbox">
            Remember me
        </label>
         </div>

         <button type="submit" class="submit-btn"> Continue <i class="fa-solid fa-arrow-right-long"></i>

    </button>


    <div class="acc">
    <p>Don't have an account?<a href="login.html">Login</a></p>
  </div>








        </form>
        </div>
        






    
</body>
</html>
