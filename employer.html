<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="employer.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <title>Recruitment-Project</title>
</head>
<body>

  <div class="logos">


    <div class="logo">
        <img src="logo.png" alt="">
        <div class="logotext">
        <h1>TalLink</h1>
        <p style="font-size: 10px; color: steelblue;">Connecting Talent & Oppotunity</p>
        </div>

    </div>

    <a href="index.html" style="font-size: 14px;">Back to website<i class="fa-solid fa-arrow-right-long"></i></a>
    </div>



  <div class="hero">
    <div class="hero-header">
      <p style="color: #0fa8b8; font-weight: bold; font-size: 14px;">Sign up as an Employer</p>
      <h1>Create your <span style="color: #0fa8b8; ">account</span></h1>
      <p>Join us to discover new opportunities, build your career and achieve your goals.</p>
      <img src="workman.png" alt="">
    </div>
    <div class="hero-input">

      <form action="company.html" method="post">


       <div class="form-group">
          <label for="firstname">First name</label>
          <div class="group">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="firstname" placeholder="First name" required>
        </div>

        <div class="form-group">
          <label for="lastname">Last name</label>
          <div class="group">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="lastname" placeholder="Last name" required>
        </div>

        <div class="form-group">
          <label for="email">Work Email</label>
          <div class="group">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="work-email" placeholder="you@company.com" required>
        </div>


        
     <div class="form-group">
    <label for="course">Position in Company</label>
    <div class="post">
    <select id="course" name="course" required>
        <option value="">Select...</option>
        <option value="C-level">C-level: CEO / COO / CIO / CFO / CTO / CPO</option>
        <option value="senior">Senior Management: Head of Department / Team Lead</option>
        <option value="middle">Middle Management: Supervisor / Supervisor / Unit Head</option>
        <option value="junior">Junior Level: Associate / Officer</option>


    </select>
    </div>
    </div>

        

         <div class="form-group">
         
                <label for="course">Telephone no.</label>
                 <div class="eng">
                <div class="group">
                    
                <select name="course" id="course" required>
                    <option value="">Country</option>
                    <option value="nigeria">Nigeria (+234)</option>
                    <option value="afghanistan">Afghanistan (+93)</option>
                    <option value="canada">Canada (+1)</option>
                    <option value="egypt">Egypt (+20)</option>
                    <option value="france">France (+33)</option>
                    <option value="germany">Germany (+49)</option>
                    <option value="hungary">Hungary (+36)</option>
                    <option value="italy">Italy (+39)</option>
                    <option value="kenya">Kenya (+254)</option>
                    <option value="malaysia">Malaysia (+60)</option>
                </select>

                <input type="tel" id="phone" placeholder="+000-000-0000" required>
                </div>
                 </div>
            </div>


            
              <div class="checkbox-group">
        <label>
            <input type="checkbox" required>
            Email me high quality articles on HR and recruiting
        </label>
         </div>

         <button type="submit" class="submit-btn"> Next <i class="fa-solid fa-arrow-right-long"></i>

    </button>



  </form>

  <div class="divider">
    <span>Or Sign up with</span>
  </div>
  <div class="brands">
    <div class="brand">
    <i class="fa-brands fa-google"></i>
    </div>

    <div class="brand">
      <i class="fa-brands fa-square-facebook"></i>
    </div>

  
    <div class="brand">
      <i class="fa-brands fa-square-linkedin"></i>
    </div>
  </div>

  <div class="acc">
    <p>Already have an account?<a href="login.html">Login</a></p>
  </div>







    </div>
  </div>
    
</body>
</html>
